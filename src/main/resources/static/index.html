<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | SWI Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900" x-data="app()">

<div class="max-w-6xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">Správa systému</h1>
            <p class="text-slate-500 mt-1">Ukázka vazeb 1:M (Oddělení) a M:N (Role)</p>
        </div>
        <div class="flex gap-3">
            <button @click="generateData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-sm transition-all flex items-center gap-2">
                <span>⚡</span> Generovat data
            </button>
        </div>
    </div>

    <!-- Filters & Search -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4">
        <div class="relative flex-1">
            <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
            <input type="text" x-model="search" placeholder="Hledat podle jména, emailu nebo oddělení..."
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
                <th @click="sort('lastName')" class="px-6 py-4 cursor-pointer hover:bg-slate-100 transition text-xs font-bold uppercase tracking-wider text-slate-500">Uživatel ↕️</th>
                <th @click="sort('department.name')" class="px-6 py-4 cursor-pointer hover:bg-slate-100 transition text-xs font-bold uppercase tracking-wider text-slate-500">Oddělení (1:M) ↕️</th>
                <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500">Role (M:N)</th>
                <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500 text-right">ID</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <template x-for="user in filteredUsers()" :key="user.id">
                <tr class="hover:bg-indigo-50/30 transition">
                    <td class="px-6 py-4">
                        <div class="font-semibold text-slate-800" x-text="user.firstName + ' ' + user.lastName"></div>
                        <div class="text-sm text-slate-400" x-text="user.email"></div>
                    </td>
                    <td class="px-6 py-4">
                                <span class="px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-sm font-medium"
                                      x-text="user.department ? user.department.name : 'Bez oddělení'"></span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-1">
                            <template x-for="role in user.roles">
                                <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-[11px] font-bold uppercase" x-text="role.name"></span>
                            </template>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right font-mono text-[10px] text-slate-300" x-text="user.id"></td>
                </tr>
            </template>
            </tbody>
        </table>

        <!-- Empty state -->
        <div x-show="filteredUsers().length === 0" class="p-20 text-center text-slate-400">
            <div class="text-4xl mb-2">📁</div>
            <p>Nenalezeni žádní uživatelé. Zkuste kliknout na Generovat.</p>
        </div>
    </div>
</div>

<script>
    function app() {
        return {
            users: [],
            search: '',
            sortCol: 'lastName',
            sortAsc: true,
            init() { this.load(); },
            load() {
                fetch('/api/test/users').then(r => r.json()).then(d => this.users = d);
            },
            generateData() {
                fetch('/api/test/generate').then(() => this.load());
            },
            sort(col) {
                if(this.sortCol === col) this.sortAsc = !this.sortAsc;
                this.sortCol = col;
            },
            filteredUsers() {
                return this.users
                    .filter(u => {
                        const term = this.search.toLowerCase();
                        return u.firstName.toLowerCase().includes(term) ||
                               u.lastName.toLowerCase().includes(term) ||
                               (u.department && u.department.name.toLowerCase().includes(term));
                    })
                    .sort((a, b) => {
                        let valA = a[this.sortCol];
                        let valB = b[this.sortCol];
                        // Speciální case pro vnořené oddělení
                        if(this.sortCol === 'department.name') {
                            valA = a.department?.name || '';
                            valB = b.department?.name || '';
                        }
                        let res = valA < valB ? -1 : 1;
                        return this.sortAsc ? res : -res;
                    });
            }
        }
    }
</script>
</body>
</html>
